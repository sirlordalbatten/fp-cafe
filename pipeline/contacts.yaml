# Who to call when under attack. National reporting points and victim-help services.
# Links are re-checked weekly by the pipeline; a broken link falls back to the agency home page.
# kind: cert (national CERT / cyber agency) | police (crime / fraud reporting) | reg (data protection regulator) | help (victim help, tools)
countries:
  US: {name: United States, items: [
    {kind: cert, n: "CISA", what: "Report incidents, ransomware and vulnerabilities to the US cyber agency.", u: "https://www.cisa.gov/report", home: "https://www.cisa.gov/"},
    {kind: police, n: "FBI IC3", what: "Report cybercrime, ransomware, business email compromise and payment fraud.", u: "https://www.ic3.gov/", home: "https://www.ic3.gov/"}]}
  GB: {name: United Kingdom, items: [
    {kind: cert, n: "NCSC", what: "Report a significant cyber incident to the UK's National Cyber Security Centre.", u: "https://report.ncsc.gov.uk/", home: "https://www.ncsc.gov.uk/"},
    {kind: police, n: "Action Fraud", what: "Report fraud and cybercrime in England, Wales and Northern Ireland (Scotland: Police Scotland, 101).", u: "https://www.actionfraud.police.uk/", home: "https://www.actionfraud.police.uk/"}]}
  SG: {name: Singapore, items: [
    {kind: cert, n: "CSA / SingCERT", what: "Report cyber incidents to the Cyber Security Agency of Singapore.", u: "https://www.csa.gov.sg/", home: "https://www.csa.gov.sg/"},
    {kind: police, n: "Singapore Police Force", what: "Report crimes and scams. Emergency: 999. ScamShield Helpline: 1799.", u: "https://www.police.gov.sg/", home: "https://www.police.gov.sg/"},
    {kind: reg, n: "PDPC", what: "Notify the Personal Data Protection Commission about notifiable data breaches.", u: "https://www.pdpc.gov.sg/", home: "https://www.pdpc.gov.sg/"}]}
  AU: {name: Australia, items: [
    {kind: cert, n: "ASD ReportCyber", what: "Report cybercrime and incidents. Hotline 1300 CYBER1 (1300 292 371).", u: "https://www.cyber.gov.au/report-and-recover/report", home: "https://www.cyber.gov.au/"},
    {kind: reg, n: "OAIC", what: "Notify the regulator about eligible data breaches.", u: "https://www.oaic.gov.au/", home: "https://www.oaic.gov.au/"}]}
  CA: {name: Canada, items: [
    {kind: cert, n: "Canadian Centre for Cyber Security", what: "Report cyber incidents.", u: "https://www.cyber.gc.ca/en/incident-management", home: "https://www.cyber.gc.ca/"},
    {kind: police, n: "Canadian Anti-Fraud Centre", what: "Report fraud and scams.", u: "https://antifraudcentre-centreantifraude.ca/", home: "https://antifraudcentre-centreantifraude.ca/"}]}
  IN: {name: India, items: [
    {kind: cert, n: "CERT-In", what: "Report cyber incidents to India's national CERT.", u: "https://www.cert-in.org.in/", home: "https://www.cert-in.org.in/"},
    {kind: police, n: "National Cyber Crime Reporting Portal", what: "Report cybercrime and financial fraud. Helpline 1930.", u: "https://cybercrime.gov.in/", home: "https://cybercrime.gov.in/"}]}
  MY: {name: Malaysia, items: [{kind: cert, n: "MyCERT (Cyber999)", what: "Report incidents to Malaysia's national CERT.", u: "https://www.mycert.org.my/", home: "https://www.mycert.org.my/"}]}
  TH: {name: Thailand, items: [{kind: cert, n: "ThaiCERT", what: "Thailand's national CERT.", u: "https://www.thaicert.or.th/", home: "https://www.thaicert.or.th/"}]}
  ID: {name: Indonesia, items: [{kind: cert, n: "BSSN", what: "Indonesia's National Cyber and Crypto Agency.", u: "https://www.bssn.go.id/", home: "https://www.bssn.go.id/"}]}
  MM: {name: Myanmar, items: [{kind: cert, n: "mmCERT", what: "Myanmar's national CERT.", u: "https://www.mmcert.org.mm/", home: "https://www.mmcert.org.mm/"}]}
  HK: {name: Hong Kong, items: [{kind: cert, n: "HKCERT", what: "Hong Kong's computer emergency response team.", u: "https://www.hkcert.org/", home: "https://www.hkcert.org/"}]}
  JP: {name: Japan, items: [{kind: cert, n: "JPCERT/CC", what: "Report incidents to Japan's coordination centre.", u: "https://www.jpcert.or.jp/english/", home: "https://www.jpcert.or.jp/"}]}
  KR: {name: South Korea, items: [{kind: cert, n: "KISA KrCERT/CC", what: "Korea Internet & Security Agency incident response.", u: "https://www.krcert.or.kr/", home: "https://www.kisa.or.kr/"}]}
  NZ: {name: New Zealand, items: [{kind: cert, n: "NCSC New Zealand", what: "Report cyber incidents (CERT NZ is now part of the NCSC).", u: "https://www.ncsc.govt.nz/", home: "https://www.ncsc.govt.nz/"}]}
  DE: {name: Germany, items: [{kind: cert, n: "BSI", what: "Federal Office for Information Security.", u: "https://www.bsi.bund.de/", home: "https://www.bsi.bund.de/"}]}
  FR: {name: France, items: [
    {kind: cert, n: "CERT-FR (ANSSI)", what: "France's government CERT.", u: "https://www.cert.ssi.gouv.fr/", home: "https://www.cert.ssi.gouv.fr/"},
    {kind: help, n: "Cybermalveillance.gouv.fr", what: "Victim assistance for organisations and individuals.", u: "https://www.cybermalveillance.gouv.fr/", home: "https://www.cybermalveillance.gouv.fr/"}]}
  NL: {name: Netherlands, items: [{kind: cert, n: "NCSC-NL", what: "Dutch National Cyber Security Centre.", u: "https://www.ncsc.nl/", home: "https://www.ncsc.nl/"}]}
  IE: {name: Ireland, items: [{kind: cert, n: "NCSC Ireland", what: "Report incidents to Ireland's National Cyber Security Centre.", u: "https://www.ncsc.gov.ie/", home: "https://www.ncsc.gov.ie/"}]}
  EU: {name: European Union (any member state), items: [
    {kind: cert, n: "CSIRTs Network", what: "Find your country's official CSIRT.", u: "https://csirtsnetwork.eu/", home: "https://csirtsnetwork.eu/"},
    {kind: police, n: "Europol", what: "Find where to report cybercrime in your EU country.", u: "https://www.europol.europa.eu/report-a-crime/report-cybercrime-online", home: "https://www.europol.europa.eu/"}]}
global:
  - {kind: help, n: "No More Ransom", what: "Free decryptors for many ransomware families. Check before anything else.", u: "https://www.nomoreransom.org/", home: "https://www.nomoreransom.org/"}
  - {kind: help, n: "ID Ransomware", what: "Upload a ransom note or encrypted sample to identify the strain.", u: "https://id-ransomware.malwarehunterteam.com/", home: "https://id-ransomware.malwarehunterteam.com/"}
  - {kind: help, n: "FIRST team directory", what: "Find any country's or sector's incident response team.", u: "https://www.first.org/members/teams/", home: "https://www.first.org/"}
  - {kind: help, n: "Have I Been Pwned", what: "Check whether staff emails appear in known breaches.", u: "https://haveibeenpwned.com/", home: "https://haveibeenpwned.com/"}
  - {kind: help, n: "Netcraft report", what: "Report phishing sites for takedown.", u: "https://report.netcraft.com/", home: "https://www.netcraft.com/"}
  - {kind: help, n: "Google Safe Browsing", what: "Report a phishing page so browsers start warning users.", u: "https://safebrowsing.google.com/safebrowsing/report_phish/", home: "https://safebrowsing.google.com/"}
# Official incident-response guides shown with the playbooks (same weekly link check).
guides:
  - {kind: help, n: "NIST SP 800-61r3", what: "Incident response recommendations for cybersecurity risk management.", u: "https://csrc.nist.gov/pubs/sp/800/61/r3/final", home: "https://csrc.nist.gov/"}
  - {kind: help, n: "CISA #StopRansomware Guide", what: "Ransomware prevention and response checklist.", u: "https://www.cisa.gov/stopransomware/ransomware-guide", home: "https://www.cisa.gov/stopransomware"}
  - {kind: help, n: "NCSC incident management", what: "UK guidance on planning for and handling cyber incidents.", u: "https://www.ncsc.gov.uk/collection/incident-management", home: "https://www.ncsc.gov.uk/"}
