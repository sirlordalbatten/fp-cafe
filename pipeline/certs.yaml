# Certifications shown on the Certs tab. Evergreen facts only: no prices, exam codes or durations
# (those change; the official page is linked instead). The pipeline re-checks every link weekly.
# path: blue | red | cloud | dfir | grc | start      level: entry | mid | adv      fmt: lab | mcq | mixed
- {id: secplus, n: "CompTIA Security+", by: CompTIA, path: start, level: entry, fmt: mixed, u: "https://www.comptia.org/certifications/security", home: "https://www.comptia.org/",
   focus: "Broad security fundamentals. Often asked for in job adverts and government roles.",
   tips: ["Do the performance-based questions last: flag them, answer the quick ones first.", "Learn ports, protocols and acronyms until they're automatic.", "Use timed practice exams and review every wrong answer, not just your score."]}
- {id: isc2cc, n: "ISC2 Certified in Cybersecurity (CC)", by: ISC2, path: start, level: entry, fmt: mcq, u: "https://www.isc2.org/certifications/cc", home: "https://www.isc2.org/",
   focus: "Gentle first certification covering security principles, access control, networks and operations.",
   tips: ["Read the ISC2 wording carefully: pick the best answer, not just a correct one.", "Think like a manager: process and risk before tools.", "Good stepping stone towards CISSP later."]}
- {id: sal1, n: "TryHackMe SAL1", by: TryHackMe, path: blue, level: entry, fmt: lab, u: "https://tryhackme.com/certification/security-analyst-level-1", home: "https://tryhackme.com/",
   focus: "Hands-on L1 SOC analyst exam in a simulated SOC: triage real alerts and write incident reports.",
   tips: ["Your written reports are graded: say what happened, the evidence, and what you'd do next.", "Practise the full SOC Level 1 path and the SOC simulator before booking.", "Close false positives with a reason, not just a click."]}
- {id: btl1, n: "Blue Team Level 1 (BTL1)", by: Security Blue Team, path: blue, level: entry, fmt: lab, u: "https://www.securityblue.team/", home: "https://www.securityblue.team/",
   focus: "Practical blue-team exam: phishing analysis, SIEM, digital forensics and incident response.",
   tips: ["Build your own cheat sheet of tools and commands while you study. You'll use it in the exam.", "Practise email header analysis until you can do it without notes.", "Take breaks during the long practical exam."]}
- {id: cdsa, n: "HTB Certified Defensive Security Analyst (CDSA)", by: Hack The Box, path: blue, level: mid, fmt: lab, u: "https://academy.hackthebox.com/", home: "https://www.hackthebox.com/",
   focus: "Demanding hands-on SOC and DFIR exam with a professional incident report.",
   tips: ["Write the report as you go, with timestamps and screenshots.", "Get comfortable in both Splunk and Elastic queries.", "Treat it like a real investigation: build a timeline first."]}
- {id: ccd, n: "CyberDefenders Certified CyberDefender (CCD)", by: CyberDefenders, path: blue, level: mid, fmt: lab, u: "https://cyberdefenders.org/", home: "https://cyberdefenders.org/",
   focus: "Practical blue-team exam across SIEM, endpoint forensics, network analysis and threat hunting.",
   tips: ["Do the free CyberDefenders labs first to learn the style.", "Know your Windows artefacts: prefetch, amcache, shellbags, event logs.", "Keep notes of every flag path you take; it helps when you get stuck."]}
- {id: cysa, n: "CompTIA CySA+", by: CompTIA, path: blue, level: mid, fmt: mixed, u: "https://www.comptia.org/certifications/cybersecurity-analyst", home: "https://www.comptia.org/",
   focus: "Analyst-level exam on threat detection, vulnerability management and incident response.",
   tips: ["Expect log and scan output to interpret: practise reading raw logs.", "Know vulnerability scoring and prioritisation well.", "Flag the performance-based questions and come back to them."]}
- {id: sc200, n: "Microsoft Security Operations Analyst (SC-200)", by: Microsoft, path: blue, level: mid, fmt: mcq, u: "https://learn.microsoft.com/en-us/credentials/certifications/security-operations-analyst/", home: "https://learn.microsoft.com/en-us/credentials/",
   focus: "Microsoft Sentinel, Defender XDR and KQL for SOC work.",
   tips: ["Write KQL every day: the free Microsoft Learn sandbox is enough.", "Know which Defender product owns which alert.", "Microsoft role-based certs renew with a free online assessment: don't let it lapse."]}
- {id: osda, n: "OffSec Defense Analyst (OSDA)", by: OffSec, path: blue, level: mid, fmt: lab, u: "https://www.offsec.com/courses/soc-200/", home: "https://www.offsec.com/",
   focus: "Detect and investigate attacks in a live lab with a SIEM, then report on them.",
   tips: ["Map what you find to ATT&CK as you go; the report expects it.", "Learn the attacker side too: you detect faster when you know the technique.", "Practise building searches from scratch, not just running saved ones."]}
- {id: gcih, n: "GIAC Certified Incident Handler (GCIH)", by: GIAC, path: dfir, level: mid, fmt: mixed, u: "https://www.giac.org/certifications/certified-incident-handler-gcih/", home: "https://www.giac.org/",
   focus: "Incident handling and the attacker techniques behind incidents. Open book.",
   tips: ["Build a good index of the books: it's the classic GIAC tip for a reason.", "Do both practice tests: the first to find gaps, the second to test your index.", "Practise the hands-on CyberLive-style questions in a real lab."]}
- {id: gcfa, n: "GIAC Certified Forensic Analyst (GCFA)", by: GIAC, path: dfir, level: adv, fmt: mixed, u: "https://www.giac.org/certifications/certified-forensic-analyst-gcfa/", home: "https://www.giac.org/",
   focus: "Advanced incident response and forensics: memory, timelines and threat hunting.",
   tips: ["Get fluent with memory analysis and super-timelines.", "Index artefacts by question type: 'what ran', 'who logged in', 'what left'.", "Practise on public forensic images before the exam."]}
- {id: oscp, n: "OffSec Certified Professional (OSCP)", by: OffSec, path: red, level: mid, fmt: lab, u: "https://www.offsec.com/courses/pen-200/", home: "https://www.offsec.com/",
   focus: "The best-known hands-on pentest exam, including an Active Directory set and a written report.",
   tips: ["Active Directory is a big part: practise full AD chains, not single boxes.", "Enumerate twice before you exploit once.", "Your report counts: take screenshots and notes for every step as you go.", "Check the current renewal rules for the OSCP+ credential on the official page."]}
- {id: pnpt, n: "Practical Network Penetration Tester (PNPT)", by: TCM Security, path: red, level: mid, fmt: lab, u: "https://certifications.tcm-sec.com/pnpt/", home: "https://tcm-sec.com/",
   focus: "Realistic external-to-internal pentest with OSINT, a written report and a live debrief.",
   tips: ["OSINT matters: start with the people and the company, not the ports.", "Write the report like a consultant: impact first, then steps.", "Rehearse the debrief out loud."]}
- {id: cpts, n: "HTB Certified Penetration Testing Specialist (CPTS)", by: Hack The Box, path: red, level: mid, fmt: lab, u: "https://academy.hackthebox.com/", home: "https://www.hackthebox.com/",
   focus: "Very hands-on, long-format pentest exam with a commercial-grade report.",
   tips: ["Finish the whole Penetration Tester path; the exam assumes all of it.", "Keep a running notes file per host from minute one.", "Pace yourself: it's a marathon, not a CTF."]}
- {id: ejpt, n: "eLearnSecurity Junior Penetration Tester (eJPT)", by: INE, path: red, level: entry, fmt: lab, u: "https://security.ine.com/certifications/ejpt-certification/", home: "https://ine.com/",
   focus: "Entry-level practical pentest: answer questions by working in a live lab.",
   tips: ["Map the network carefully first: many answers come from good enumeration.", "Practise pivoting through a compromised host.", "Read every question before starting so you know what to look for."]}
- {id: crto, n: "Certified Red Team Operator (CRTO)", by: Zero-Point Security, path: red, level: adv, fmt: lab, u: "https://www.zeropointsecurity.co.uk/", home: "https://www.zeropointsecurity.co.uk/",
   focus: "Red team operations with a C2 framework: initial access, lateral movement, OPSEC.",
   tips: ["Think about detection: OPSEC mistakes are what blue teams catch.", "Practise Kerberos abuse until it's routine.", "Great for blue teamers too: you'll understand what your EDR sees."]}
- {id: crtp, n: "Certified Red Team Professional (CRTP)", by: Altered Security, path: red, level: mid, fmt: lab, u: "https://www.alteredsecurity.com/", home: "https://www.alteredsecurity.com/",
   focus: "Active Directory attacks and abuse from a domain user to domain admin.",
   tips: ["Learn the 'why' of each AD attack, not just the tool command.", "Use built-in tools as well as offensive ones.", "Blue teamers: it's one of the best ways to understand AD attack paths."]}
- {id: bscp, n: "Burp Suite Certified Practitioner (BSCP)", by: PortSwigger, path: red, level: mid, fmt: lab, u: "https://portswigger.net/web-security/certification", home: "https://portswigger.net/",
   focus: "Practical web application hacking exam built on the free Web Security Academy.",
   tips: ["Do every apprentice and practitioner lab in the free Web Security Academy.", "You need Burp Suite Professional for the exam.", "Build a checklist per vulnerability class and work through it fast."]}
- {id: aws_sec, n: "AWS Certified Security - Specialty", by: AWS, path: cloud, level: adv, fmt: mcq, u: "https://aws.amazon.com/certification/certified-security-specialty/", home: "https://aws.amazon.com/certification/",
   focus: "Securing AWS: IAM, logging, detection, data protection and incident response.",
   tips: ["IAM policy evaluation logic comes up everywhere: master it.", "Know which service logs what: CloudTrail, Config, GuardDuty, Security Hub.", "Hands-on in a free-tier account beats reading."]}
- {id: az500, n: "Microsoft Azure Security Engineer (AZ-500)", by: Microsoft, path: cloud, level: mid, fmt: mcq, u: "https://learn.microsoft.com/en-us/credentials/certifications/azure-security-engineer/", home: "https://learn.microsoft.com/en-us/credentials/",
   focus: "Identity, platform protection and security operations in Azure.",
   tips: ["Entra ID and Conditional Access are a big share: lab them.", "Know the difference between the Defender for Cloud plans.", "Renew yearly with the free online assessment."]}
- {id: gcp_sec, n: "Google Professional Cloud Security Engineer", by: Google Cloud, path: cloud, level: adv, fmt: mcq, u: "https://cloud.google.com/learn/certification/cloud-security-engineer", home: "https://cloud.google.com/learn/certification",
   focus: "Designing and operating secure Google Cloud environments.",
   tips: ["Organisation policies and IAM hierarchy are central.", "Know VPC Service Controls and when to use them.", "Read case-study questions for the business constraint first."]}
- {id: ccsk, n: "Certificate of Cloud Security Knowledge (CCSK)", by: Cloud Security Alliance, path: cloud, level: entry, fmt: mcq, u: "https://cloudsecurityalliance.org/education/ccsk", home: "https://cloudsecurityalliance.org/",
   focus: "Vendor-neutral cloud security knowledge, from shared responsibility to incident response.",
   tips: ["Read the CSA guidance it's based on; questions follow it closely.", "It's open book, but know where things are.", "Good companion to a vendor-specific cert."]}
- {id: cissp, n: "CISSP", by: ISC2, path: grc, level: adv, fmt: mcq, u: "https://www.isc2.org/certifications/cissp", home: "https://www.isc2.org/",
   focus: "Senior, broad security certification for leads, architects and managers. Needs work experience.",
   tips: ["Think like a risk manager, not a technician.", "Learn why each answer is right; memorising question banks doesn't transfer.", "You can pass before you have the experience and become an Associate of ISC2."]}
- {id: cism, n: "CISM", by: ISACA, path: grc, level: adv, fmt: mcq, u: "https://www.isaca.org/credentialing/cism", home: "https://www.isaca.org/",
   focus: "Security management: governance, risk, programme and incident management.",
   tips: ["ISACA wants the business view: align with governance and risk appetite.", "Use the official question database: wording matters.", "Pairs well with real experience leading a team."]}
