- {id: cisa, n: "Certified Information Systems Auditor (CISA)", by: ISACA, path: grc, level: mid, fmt: mcq, u: "https://www.isaca.org/credentialing/cisa", home: "https://www.isaca.org/",
   focus: "IT audit, control and assurance. The standard for security audit roles.",
   tips: ["Answer from an auditor's view: independence and evidence first.", "Use the official question bank and review every explanation.", "Know audit process steps in order."]}
- {id: crisc, n: "Certified in Risk and Information Systems Control (CRISC)", by: ISACA, path: grc, level: adv, fmt: mcq, u: "https://www.isaca.org/credentialing/crisc", home: "https://www.isaca.org/",
   focus: "IT risk management: identifying, assessing, responding to and monitoring risk.",
   tips: ["Pick answers that put risk owners and the business first.", "Know the difference between inherent and residual risk well.", "Practise with the official question bank."]}
- {id: cgrc, n: "Certified in Governance, Risk and Compliance (CGRC)", by: ISC2, path: grc, level: mid, fmt: mcq, u: "https://www.isc2.org/certifications/cgrc", home: "https://www.isc2.org/",
   focus: "Authorising and monitoring information systems within risk frameworks such as NIST RMF.",
   tips: ["Learn the NIST Risk Management Framework steps in order.", "Know who is responsible at each step.", "Relate each control to a real system you know."]}
- {id: securityx, n: "CompTIA SecurityX (formerly CASP+)", by: CompTIA, path: grc, level: adv, fmt: mixed, u: "https://www.comptia.org/certifications/securityx", home: "https://www.comptia.org/",
   focus: "Senior hands-on security architecture and engineering, for practitioners rather than managers.",
